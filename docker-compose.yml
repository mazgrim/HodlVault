# HodlVault — stack di produzione: il frontend (nginx) serve la build statica e
# fa da reverse proxy verso il backend FastAPI. Avvio: docker compose up -d --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/hodlvault.db
    volumes:
      - hodlvault_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  hodlvault_data:
    driver: local
