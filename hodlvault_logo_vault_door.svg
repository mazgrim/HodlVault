<!-- HodlVault — logo alternativo (icona porta del caveau) -->
<svg width="400" height="480" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>HodlVault logo - Porta Vault</title>
  <desc>Logo HodlVault: cerchio con ruota di cassaforte, raggi e manopola centrale in oro su fondo scuro</desc>

  <rect width="400" height="480" fill="#111118"/>

  <!-- Anello esterno moneta -->
  <circle cx="200" cy="195" r="130" fill="none" stroke="#E8B820" stroke-width="3.5"/>
  <!-- Zigrinatura moneta -->
  <circle cx="200" cy="195" r="121" fill="none" stroke="#C8960C" stroke-width="6" stroke-dasharray="6 4"/>
  <!-- Fondo scuro moneta -->
  <circle cx="200" cy="195" r="113" fill="#1a1a2e"/>
  <!-- Anello interno sottile -->
  <circle cx="200" cy="195" r="111" fill="none" stroke="#C8960C" stroke-width="1"/>

  <!-- Anello porta vault esterno -->
  <circle cx="200" cy="195" r="88" fill="none" stroke="#E8B820" stroke-width="2.5"/>
  <!-- Anello porta vault interno -->
  <circle cx="200" cy="195" r="64" fill="none" stroke="#C8960C" stroke-width="2"/>

  <!-- Raggi cardinali (N S E O) — più spessi -->
  <line x1="200" y1="107" x2="200" y2="131" stroke="#E8B820" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="259" x2="200" y2="283" stroke="#E8B820" stroke-width="4" stroke-linecap="round"/>
  <line x1="112" y1="195" x2="136" y2="195" stroke="#E8B820" stroke-width="4" stroke-linecap="round"/>
  <line x1="264" y1="195" x2="288" y2="195" stroke="#E8B820" stroke-width="4" stroke-linecap="round"/>

  <!-- Raggi diagonali — più sottili -->
  <line x1="138" y1="133" x2="155" y2="150" stroke="#C8960C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="245" y1="240" x2="262" y2="257" stroke="#C8960C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="262" y1="133" x2="245" y2="150" stroke="#C8960C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="155" y1="240" x2="138" y2="257" stroke="#C8960C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Disco centrale manopola -->
  <circle cx="200" cy="195" r="36" fill="#C8960C"/>
  <circle cx="200" cy="195" r="28" fill="#1a1a2e"/>
  <circle cx="200" cy="195" r="10" fill="#E8B820"/>

  <!-- Leva manopola -->
  <rect x="214" y="191" width="36" height="8" rx="4" fill="#E8B820"/>
  <circle cx="252" cy="195" r="7" fill="#E8B820"/>
  <circle cx="252" cy="195" r="4" fill="#C8960C"/>

  <!-- Riflesso luce sul disco centrale -->
  <circle cx="191" cy="186" r="5" fill="#F0C840" opacity="0.35"/>

  <!-- Wordmark -->
  <text x="200" y="376"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="38" font-weight="700"
    letter-spacing="5"
    fill="#E8B820">HODL</text>
  <text x="200" y="410"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="22"
    letter-spacing="14"
    fill="#C8960C">VAULT</text>

</svg>
